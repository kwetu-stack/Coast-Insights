<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Coast Insights™
        {% endblock %}
    </title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Kwetu Theme -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/kwetu-theme.css') }}">

    {% block styles %}
    {% endblock %}

</head>

<body>

    <main>

        <div class="container">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}

                        <div class="card" style="margin-bottom:20px;">

                            {{ message }}

                        </div>

                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% block content %}
            {% endblock %}

        </div>

    </main>

    {% block scripts %}
    {% endblock %}

</body>

</html>
