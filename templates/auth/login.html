{% extends "base_public.html" %}

{% block title %}
Coast Insights™ | Login
{% endblock %}

{% block content %}
<div class="login-wrapper">

    <div class="login-card">

        <h1 class="login-title">
            Coast Insights™
        </h1>

        <p class="login-subtitle">
            Executive Sales Intelligence Platform
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>

            <div class="checkbox-group">

    <input
        type="checkbox"
        id="remember"
        name="remember">

    <label for="remember">
        Remember Me
    </label>

</div>

                    <button
            class="btn btn-primary"
            type="submit"
            style="width:100%;">

            Login

        </button>

    </form>


    <div style="text-align:center; margin-top:25px; color:#64748b;">

        Coast Insights™
        <br>
        Version 0.1

    </div>


</div>

</div>

{% endblock %}
